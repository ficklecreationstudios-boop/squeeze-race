name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BORROW_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run test:rules
      - run: npm run build
      - name: Runtime and 20-symbol acceptance test
        run: |
          npm run start > /tmp/squeeze-race.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health > /dev/null
          npm run verify:20
          npm run verify:security
          npm run backtest:proxy
          npm run backtest:rules
          npm run tune:fuel
  historical-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build leakage-safe historical dataset and calibrated models
        run: npm run historical:lab
      - name: Upload historical calibration audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-squeeze-lab
          path: artifacts/historical-lab-latest.json
          if-no-files-found: ignore
